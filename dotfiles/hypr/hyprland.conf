$mod = ALT

# Terminal
bind = $mod, Return, exec, kitty

# General
bind = $mod, Q, killactive
bind = $mod, \, exit
bind = $mod, D, exec, fuzzel


#exec-once = waybar
exec-once = awww-daemon
exec-once = awww img /home/mihao/Pictures/Wallpapers/mononoke.png

# Basic resizing:
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
#bind = $mod, -, workspace, 11
#bind = $mod, =, workspace, 12
# Special workspace / minimize-like scratchpad
bind = $mod, S, togglespecialworkspace, minimized

#move windows to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
#bind = $mod SHIFT, -, movetoworkspace, 11 
#bind = $mod SHIFT, =, movetoworkspace, 12
bind = $mod SHIFT, S, movetoworkspacesilent, special:minimized

#move focuus with arrow
bind = $mod, j, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, i, movefocus, u
bind = $mod, k, movefocus, d
#move windows in workspace
bind = $mod SHIFT, j, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, i, movewindow, u
bind = $mod SHIFT, k, movewindow, d


#System binds
# ASUS volume special keys
bindel = , code:122, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , code:123, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+

# Brightness on F7/F8
bindel = , code:73, exec, brightnessctl -c backlight set 5%-
bindel = , code:74, exec, brightnessctl -c backlight set 5%+



# browser
bind = $mod, b, exec, firefox

# file manager
bind = $mod, e, exec, dolphin

# reload config
bind = $mod shift, r, exec, hyprctl reload

# lock screen (later)
bind = $mod shift, l, exec, hyprlock

# screenshot (later)
bind = , print, exec, grimblast copy area


# Custom apps binds
hl.bind(mod .. " + C", hl.dsp.exec_cmd("/home/mihao/.local/bin/dashboard"))
bind = $mod, V, exec, /home/mihao/.local/bin/mihao-asus
bind = $mod, T, exec, /home/mihao/.local/bin/theme-picker



# Gestures:
gestures {
    # Swipe horizontally with 3 fingers to switch between workspaces
    gesture = 3, horizontal, workspace
    
    # Optional: Swipe vertically with 3 fingers to interact with special workspaces
    gesture = 3, vertical, special
}


#Window styling
monitor = eDP-1, preferred, 0x0, 1.6

#Fix blurry apps:
xwayland {
    force_zero_scaling = true use_nearest_neighbor = false 
    }


general {
    gaps_in = 3     # Tiny gap between windows
    gaps_out = 7    # Tiny gap at screen edges
    border_size = 1 # Thin window borders
}

decoration {
    rounding = 7

    active_opacity = 0.95
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 6 #6 defualt
        passes = 2 #2 default
	vibrancy = 0.2
    }
}



#Animations
animations {
    enabled = yes

    # Define a custom bezier curve
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Apply the curve to different animation trees
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default

    # Normal workspace switching, still left/right
    animation = workspaces, 1, 6, default, slide

    # Special workspace / scratchpad animation
    animation = specialWorkspace, 1, 6, myBezier, slidefadevert 40%
}


#Custom settings

#Dashboard
layerrule = blur on, ignore_alpha 0.0, match:namespace mihao-dashboard

#Asus Dashboard:
#layerrule = blur on, ignore_alpha 0.0, match:namespace mihao-asus

# Theme picker
layerrule = blur on, ignore_alpha 0.4, match:namespace theme-picker


