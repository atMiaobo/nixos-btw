font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 12.0
background_opacity 0.85

cursor_shape beam
cursor_blink_interval 0.5

cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

#maybe move to Home Manager later...
confirm_os_window_close 0

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# BEGIN_KITTY_THEME
# Sonokai Sushia
include current-theme.conf
# END_KITTY_THEME

# Wallpaper colors follow the native block so kitten themes cannot replace this
# include. Native presets remain available; theme apply restores saved colors.
include ~/.local/share/mihao-theme/kitty.conf
